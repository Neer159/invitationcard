<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>લગ્ન પત્રિકા — Name Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f5f1e8; color: #5a1c16;
    font-family: system-ui, -apple-system, "Noto Sans Gujarati", "Nirmala UI", sans-serif;
  }
  .app { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 4px; text-align:center; }
  .sub { text-align:center; color:#765b52; font-size:13px; margin-bottom:14px; }
  .card {
    background:white; border-radius:18px; padding:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.10);
  }
  label { display:block; font-weight:700; margin:2px 0 7px; }
  input {
    width:100%; padding:13px 14px; border:1px solid #d7c4a1;
    border-radius:12px; font-size:18px; outline:none;
  }
  input:focus { border-color:#9d2d20; box-shadow:0 0 0 3px rgba(157,45,32,.10); }
  .preview {
    margin-top:14px; background:#eee; border-radius:12px; overflow:hidden;
    line-height:0; position:relative;
  }
  canvas { width:100%; height:auto; display:block; }
  .row { display:flex; gap:9px; margin-top:12px; }
  button {
    flex:1; border:0; border-radius:12px; padding:13px 10px;
    font-size:16px; font-weight:700; cursor:pointer;
  }
  .primary { background:#8f241b; color:white; }
  .secondary { background:#eee2cd; color:#5a1c16; }
  .hint { font-size:12px; color:#76665e; margin-top:10px; line-height:1.45; }
  .status { text-align:center; min-height:18px; font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<div class="app">
  <h1>લગ્ન પત્રિકા નામ જનરેટર</h1>
  <div class="sub">નામ લખો → પત્રિકા તૈયાર → WhatsApp પર શેર કરો</div>

  <div class="card">
    <label for="name">આમંત્રિતનું નામ</label>
    <input id="name" type="text" inputmode="text"
           placeholder="દા.ત. મહેશભાઈ પટેલ" autocomplete="off">

    <div class="preview">
      <canvas id="canvas"></canvas>
    </div>

    <div class="row">
      <button class="secondary" id="clear">નામ સાફ કરો</button>
      <button class="primary" id="download">PNG સેવ કરો</button>
    </div>
    <div class="row">
      <button class="primary" id="share">WhatsApp / Share</button>
    </div>

    <div class="hint">
      Tip: ગુજરાતી નામ ફોનમાં સીધું લખી શકો છો. “Share” તમારા ફોનના
      sharing options ખોલશે; જો browser sharing support ન કરે તો PNG સેવ કરીને WhatsAppમાં મોકલો.
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const img = new Image();
img.src = "invitation-neer.png";
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const input = document.getElementById("name");
const status = document.getElementById("status");

// Coordinates are based on the supplied 1024×1536 invitation.
// The blank invitee line is in the lower-left box.
const NAME_X = 185;
const NAME_Y = 1379;
const NAME_MAX_WIDTH = 500;

function draw() {
  if (!img.complete) return;
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  ctx.drawImage(img, 0, 0);

  const name = input.value.trim();
  if (!name) return;

  // Use a Gujarati-capable browser/system font.
  ctx.fillStyle = "#8f241b";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";

  let size = 27;
  while (size > 25) {
    ctx.font = `700 ${size}px "Noto Sans Gujarati", "Nirmala UI", "Shruti", sans-serif`;
    if (ctx.measureText(name).width <= NAME_MAX_WIDTH) break;
    size -= 1;
  }

  ctx.fillText(name, NAME_X, NAME_Y);
}

img.onload = draw;
input.addEventListener("input", draw);

document.getElementById("clear").onclick = () => {
  input.value = "";
  draw();
  input.focus();
  status.textContent = "";
};

function getFile() {
  return new Promise(resolve => canvas.toBlob(blob =>
    resolve(new File([blob], "wedding-invitation.png", {type:"image/png"})), "image/png"));
}

document.getElementById("download").onclick = () => {
  if (!input.value.trim()) {
    status.textContent = "પહેલા આમંત્રિતનું નામ લખો.";
    input.focus();
    return;
  }
  const a = document.createElement("a");
  a.download = "wedding-invitation-" + input.value.trim().replace(/[^\p{L}\p{N}]+/gu, "-") + ".png";
  a.href = canvas.toDataURL("image/png");
  a.click();
  status.textContent = "PNG તૈયાર છે.";
};

document.getElementById("share").onclick = async () => {
  if (!input.value.trim()) {
    status.textContent = "પહેલા આમંત્રિતનું નામ લખો.";
    input.focus();
    return;
  }
  try {
    const file = await getFile();
    if (navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))) {
      await navigator.share({
        title: "લગ્ન પત્રિકા",
        text: "લગ્ન પ્રસંગે આપને હાર્દિક આમંત્રણ.",
        files: [file]
      });
      status.textContent = "Share menu ખોલ્યું.";
    } else {
      const a = document.createElement("a");
      a.download = "wedding-invitation.png";
      a.href = URL.createObjectURL(file);
      a.click();
      status.textContent = "તમારા ફોનમાં PNG સેવ કરો અને WhatsAppમાં મોકલો.";
    }
  } catch (e) {
    if (e.name !== "AbortError") status.textContent = "Share શક્ય ન થયું. PNG સેવ કરો.";
  }
};
</script>
</body>
</html>
